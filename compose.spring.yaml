services:
  grafana:
    extends:
      file: compose.yaml
      service: grafana
    profiles:
      - grafana

  jaeger:
    extends:
      file: compose.yaml
      service: jaeger
    profiles:
      - jaeger

  mcp-currency:
    extends:
      file: compose.yaml
      service: mcp-currency
    profiles:
      - mcp-currency

  mcp-filesystem:
    extends:
      file: compose.yaml
      service: mcp-filesystem
    profiles:
      - mcp-filesystem

  mcp-weather:
    extends:
      file: compose.yaml
      service: mcp-weather
    profiles:
      - mcp-weather

  minio:
    extends:
      file: compose.yaml
      service: minio
    profiles:
      - minio

  ollama:
    extends:
      file: compose.yaml
      service: ollama
    profiles:
      - ollama

  prometheus:
    extends:
      file: compose.yaml
      service: prometheus
    profiles:
      - prometheus
    volumes:
      - ${PWD}/docker/prometheus/prometheus.spring.yaml:/etc/prometheus/prometheus.yaml:ro

  qdrant:
    extends:
      file: compose.yaml
      service: qdrant
    profiles:
      - qdrant

  speaches:
    extends:
      file: compose.yaml
      service: speaches
    profiles:
      - speaches

volumes:
  minio_data:
    name: sa_minio_data
  ollama_data:
    name: sa_ollama_data
  qdrant_data:
    name: sa_qdrant_data
  speaches_data:
    name: sa_speaches_data
