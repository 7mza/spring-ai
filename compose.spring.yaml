services:
  mcp-filesystem:
    extends:
      file: compose.yaml
      service: mcp-filesystem
    profiles:
      - mcp-filesystem

  mcp-stdio:
    extends:
      file: compose.yaml
      service: mcp-stdio
    profiles:
      - mcp-stdio

  minio:
    extends:
      file: compose.yaml
      service: minio
    profiles:
      - minio

  ollama:
    extends:
      file: compose.yaml
      service: ollama
    profiles:
      - ollama

  qdrant:
    extends:
      file: compose.yaml
      service: qdrant
    profiles:
      - qdrant

volumes:
  minio_data:
    name: minio_data
  ollama_data:
    name: ollama_data
  qdrant_data:
    name: qdrant_data
