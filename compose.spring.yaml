services:
  mcp-currency:
    extends:
      file: compose.yaml
      service: mcp-currency
    profiles:
      - mcp-currency

  mcp-filesystem:
    extends:
      file: compose.yaml
      service: mcp-filesystem
    profiles:
      - mcp-filesystem

  mcp-weather:
    extends:
      file: compose.yaml
      service: mcp-weather
    profiles:
      - mcp-weather

  minio:
    extends:
      file: compose.yaml
      service: minio
    profiles:
      - minio

  ollama:
    extends:
      file: compose.yaml
      service: ollama
    profiles:
      - ollama

  qdrant:
    extends:
      file: compose.yaml
      service: qdrant
    profiles:
      - qdrant

volumes:
  minio_data:
    name: minio_data
  ollama_data:
    name: ollama_data
  qdrant_data:
    name: qdrant_data
