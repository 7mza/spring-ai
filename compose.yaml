services:
  mcp-filesystem:
    build:
      dockerfile: ${PWD}/docker/node/Dockerfile
    command: >
      /bin/sh -c "npx --yes supergateway
      --stdio 'npx --yes @modelcontextprotocol/server-filesystem /projects'
      --outputTransport streamableHttp --port 3000 --healthEndpoint /health"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'wget -qO- localhost:3000/health | grep -q "ok" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - .:/projects:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    labels:
      org.springframework.boot.service-connection: s3
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/${MINIO_DEFAULT_BUCKET} --ignore-existing;"
    environment:
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    restart: on-failure

  ollama:
    build:
      dockerfile: ${PWD}/docker/ollama/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_MAX_LOADED_MODELS: 1
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'curl -fs localhost:11434 | grep -q "Ollama is running" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    labels:
      org.springframework.boot.service-connection: ollama
    ports:
      - "11434"
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    build:
      dockerfile: ${PWD}/docker/qdrant/Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'curl -fs localhost:6333/healthz | grep -q "healthz check passed" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    labels:
      org.springframework.boot.service-connection: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  spring-ai:
    image: spring-ai:latest
    depends_on:
      mcp-filesystem:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      INGEST_FILES_FILTER: ${INGEST_FILES_FILTER}
      INGEST_POLL_INTERVAL: ${INGEST_POLL_INTERVAL}
      JAVA_TOOL_OPTIONS: |
        -Dspring.aot.enabled=false
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:MaxRAMPercentage=75.0
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE}
      OLLAMA_TOP_K: ${OLLAMA_TOP_K}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P}
      SPRING_PROFILES_ACTIVE: default, container
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'wget -qO- localhost/actuator/health/liveness | grep -q "UP" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - springai_data:/data

volumes:
  minio_data:
    name: minio_data
  ollama_data:
    name: ollama_data
  qdrant_data:
    name: qdrant_data
  springai_data:
    name: springai_data
