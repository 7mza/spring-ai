services:
  ollama:
    build:
      dockerfile: ${PWD}/docker/ollama/Dockerfile
    ports:
      - "11434"
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_MAX_LOADED_MODELS: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    labels:
      org.springframework.boot.service-connection: ollama
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'curl -fs localhost:11434 | grep -q "Ollama is running" || exit 1',
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg18
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    labels:
      org.springframework.boot.service-connection: postgres
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER} | grep -q "accepting connections" || exit 1',
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  spring-ai:
    image: spring-ai:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default, container
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      JAVA_TOOL_OPTIONS: |
        -Dspring.aot.enabled=false
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'wget -qO- localhost/actuator/health/liveness | grep -q "UP" || exit 1',
        ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
    name: ollama_data
