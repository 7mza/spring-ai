services:
  grafana:
    build:
      context: ${PWD}/docker/grafana
      dockerfile: Dockerfile
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_LOG_LEVEL=warn
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -qO- localhost:3000/api/health | jq .database | grep -q "ok" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - '9091:3000'
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ${PWD}/docker/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ${PWD}/docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro

  jaeger:
    build:
      dockerfile: ${PWD}/docker/jaeger/Dockerfile
    command: ['--config', '/etc/jaeger/config.yaml']
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - OTEL_TRACES_SAMPLER=always_off
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -qO- 0.0.0.0:13133/status | jq .healthy | grep -q "true" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - '16686:16686'
      - '4317:4317'
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - ${PWD}/docker/jaeger/jaeger-ui.json:/etc/jaeger/jaeger-ui.json:ro

  mcp-currency:
    image: mcp-currency:latest
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      JAVA_TOOL_OPTIONS: |
        -Dspring.aot.enabled=false
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:MaxRAMPercentage=75.0
      SPRING_PROFILES_ACTIVE: default, container
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -qO- localhost/actuator/health/liveness | grep -q "UP" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - '3002:80'
    pull_policy: never
    restart: unless-stopped

  mcp-filesystem:
    build:
      dockerfile: ${PWD}/docker/node/Dockerfile
    command: >
      /bin/sh -c "npx --yes supergateway
      --stdio 'npx --yes @modelcontextprotocol/server-filesystem /projects'
      --outputTransport streamableHttp --port 3000 --healthEndpoint /health --logLevel none"
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -qO- localhost:3000/health | grep -q "ok" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - '3000:3000'
    restart: unless-stopped
    volumes:
      - .:/projects:ro

  mcp-weather:
    build:
      context: ${PWD}/mcp/mcp-weather
      dockerfile: Dockerfile
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -qO- localhost:3000/health | grep -q "ok" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - '3001:3000'
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    labels:
      org.springframework.boot.service-connection: s3
    ports:
      - '9000:9000'
      - '9001:9001'
    restart: unless-stopped
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/${MINIO_DEFAULT_BUCKET} --ignore-existing;"
    environment:
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    restart: on-failure

  ollama:
    image: ollama/ollama:latest
    environment:
      GIN_MODE: release
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    labels:
      org.springframework.boot.service-connection: ollama
    ports:
      - '11434:11434'
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  prometheus:
    image: prom/prometheus:latest
    command: -c "/bin/prometheus --config.file=/etc/prometheus/prometheus.yaml --log.level=warn"
    entrypoint: sh
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -qO- http://localhost:9090/-/healthy | grep -q "Prometheus Server is Healthy." || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - '9090:9090'
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__LOG_LEVEL: WARN
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/localhost/6333']
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    labels:
      org.springframework.boot.service-connection: qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    environment:
      - LOG_LEVEL=WARNING
      - UVICORN_LOG_LEVEL=warning
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'curl -fs localhost:8000/health | grep -q "OK" || exit 1',
        ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - '8000:8000'
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/speaches/model_aliases.json:/home/ubuntu/speaches/model_aliases.json
      - speaches_data:/home/ubuntu/.cache/huggingface/hub

  speaches-init:
    image: curlimages/curl:latest
    command: /bin/sh -c "curl -fs -X POST speaches:8000/v1/models/tts && curl -fs -X POST speaches:8000/v1/models/stt"
    depends_on:
      speaches:
        condition: service_healthy
    restart: on-failure

  spring-ai:
    image: spring-ai:latest
    depends_on:
      jaeger:
        condition: service_healthy
      mcp-currency:
        condition: service_healthy
      mcp-filesystem:
        condition: service_healthy
      mcp-weather:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      speaches:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      INGEST_FILES_FILTER: ${INGEST_FILES_FILTER}
      INGEST_POLL_INTERVAL: ${INGEST_POLL_INTERVAL}
      JAVA_TOOL_OPTIONS: |
        -Dspring.aot.enabled=false
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:MaxRAMPercentage=75.0
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE}
      OLLAMA_TOP_K: ${OLLAMA_TOP_K}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P}
      SPRING_PROFILES_ACTIVE: default, container
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -qO- localhost/actuator/health/liveness | grep -q "UP" || exit 1',
        ]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - '8080:80'
    pull_policy: never
    restart: unless-stopped
    volumes:
      - springai_data:/data

volumes:
  minio_data:
    name: sa_minio_data
  ollama_data:
    name: sa_ollama_data
  qdrant_data:
    name: sa_qdrant_data
  speaches_data:
    name: sa_speaches_data
  springai_data:
    name: sa_springai_data
