services:
  spring-ai:
    image: spring-ai:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: default, container
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      INGEST_DIR: ${INGEST_DIR}
      INGEST_FILES_FILTER: ${INGEST_FILES_FILTER}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE}
      OLLAMA_TOP_K: ${OLLAMA_TOP_K}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P}
      JAVA_TOOL_OPTIONS: |
        -Dspring.aot.enabled=false
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'wget -qO- localhost/actuator/health/liveness | grep -q "UP" || exit 1',
        ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ${INGEST_DIR}:/home/${INGEST_DIR}:ro

  ollama:
    build:
      dockerfile: ${PWD}/docker/ollama/Dockerfile
    ports:
      - "11434"
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_MAX_LOADED_MODELS: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    labels:
      org.springframework.boot.service-connection: ollama
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'curl -fs localhost:11434 | grep -q "Ollama is running" || exit 1',
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    build:
      dockerfile: ${PWD}/docker/qdrant/Dockerfile
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    labels:
      org.springframework.boot.service-connection: qdrant
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'curl -fs localhost:6333/healthz | grep -q "healthz check passed" || exit 1',
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s

volumes:
  ollama_data:
    name: ollama_data
