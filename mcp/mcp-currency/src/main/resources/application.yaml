custom:
  currency:
    api: https://api.frankfurter.dev/v2/rate
logging:
  include-application-name: false
management:
  endpoint:
    env:
      show-values: always
    health:
      group:
        readiness:
          include: "*"
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          compression: gzip
          endpoint: http://localhost:4317
          transport: grpc
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    propagation:
      type: B3
    sampling:
      probability: 1
server:
  compression:
    enabled: true
    mime-types: application/javascript,application/json,application/x-ndjson,application/xml,text/css,text/event-stream,text/html,text/javascript,text/plain,text/xml
    min-response-size: 1500B
  forward-headers-strategy: native
  http2:
    enabled: true
  port: 3002
  ssl:
    enabled: false
spring:
  ai:
    mcp:
      server:
        name: currency
        protocol: streamable
        type: async
  application:
    name: mcp-currency
  config:
    activate:
      on-profile: default
  devtools:
    livereload:
      enabled: true
  main:
    banner-mode: off
  output:
    ansi:
      enabled: always
  reactor:
    context-propagation: auto
tracing:
  excludeUris:
    - /actuator
    - /favicon
---
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4317
server:
  compression:
    enabled: false
  port: 80
spring:
  config:
    activate:
      on-profile: container
  devtools:
    add-properties: false
    livereload:
      enabled: false
    restart:
      enabled: false
