global:
  scrape_interval: 2s
scrape_configs:
  - job_name: spring-ai
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - spring-ai:80
  - job_name: mcp-currency
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - mcp-currency:80
